<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人信息填写表</title>
<style>
  :root { color-scheme: light; --ink:#203344; --muted:#647784; --line:#d8e2e8; --accent:#167c80; --paper:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:#eef3f4; color:var(--ink); font:16px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif; }
  main { max-width:820px; margin:40px auto; padding:38px 46px; background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:0 14px 40px #16304712; }
  header { margin-bottom:28px; padding-bottom:20px; border-bottom:1px solid var(--line); }
  .eyebrow { color:var(--accent); font-size:13px; font-weight:700; letter-spacing:.12em; }
  h1 { margin:6px 0 4px; font-size:30px; }
  header p, .hint { margin:0; color:var(--muted); font-size:14px; }
  .field { margin:20px 0; }
  label, legend { display:block; margin-bottom:8px; font-weight:700; }
  input[type="text"], input[type="month"], textarea { width:100%; padding:11px 13px; border:1px solid #c9d7df; border-radius:8px; background:#fff; color:var(--ink); font:inherit; }
  input:focus, textarea:focus { outline:3px solid #167c8026; border-color:var(--accent); }
  fieldset { margin:20px 0; padding:0; border:0; }
  .choices { display:flex; gap:22px; }
  .choices label { display:flex; align-items:center; gap:8px; margin:0; font-weight:400; }
  input[type="radio"] { accent-color:var(--accent); }
  textarea { min-height:116px; resize:vertical; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; }
  button { padding:10px 17px; border:1px solid var(--accent); border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.secondary { background:#fff; color:var(--accent); }
  button:hover { filter:brightness(.95); }
  #notice { min-height:24px; margin-top:12px; color:var(--accent); font-size:14px; }
  @media (max-width:600px) { main { margin:12px; padding:25px 20px; } h1 { font-size:25px; } }
  @media print { body { background:#fff; } main { max-width:none; margin:0; padding:12mm; border:0; border-radius:0; box-shadow:none; } .actions, #notice { display:none; } input, textarea { border-color:#9aaab3; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">PERSONAL PROFILE</div>
    <h1>个人信息填写表</h1>
    <p>请根据实际情况填写以下基本信息与工作经历。内容只暂存在当前浏览器，不会提交到网站服务器。</p>
  </header>
  <form id="profileForm">
    <div class="field">
      <label for="name">姓名</label>
      <input id="name" name="name" type="text" autocomplete="name" placeholder="请输入姓名">
    </div>
    <fieldset>
      <legend>性别</legend>
      <div class="choices">
        <label><input type="radio" name="gender" value="男"> 男</label>
        <label><input type="radio" name="gender" value="女"> 女</label>
        <label><input type="radio" name="gender" value="不便说明"> 不便说明</label>
      </div>
    </fieldset>
    <div class="field">
      <label for="birth">出生年月</label>
      <input id="birth" name="birth" type="month">
    </div>
    <div class="field">
      <label for="education">学历</label>
      <input id="education" name="education" type="text" placeholder="例如：本科、硕士研究生">
    </div>
    <div class="field">
      <label for="experience">工作经历</label>
      <textarea id="experience" name="experience" placeholder="请填写工作时间、�q位、岗位及主要职责；可分段填写"></textarea>
      <p class="hint">示例：2021.07—至今｜某某单位｜某某岗位｜负责……</p>
    </div>
    <div class="actions">
      <button type="button" id="save">暂存到本机</button>
      <button type="button" class="secondary" id="clear">清空表单</button>
      <button type="button" class="secondary" id="print">打印 / 另存为 PDF</button>
    </div>
    <div id="notice" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
  const form = document.getElementById('profileForm');
  const notice = document.getElementById('notice');
  const key = 'personal-profile-form-v1';
  function show(message) { notice.textContent = message; }
  document.getElementById('save').addEventListener('click', () => {
    const data = Object.fromEntries(new FormData(form).entries());
    try { localStorage.setItem(key, JSON.stringify(data)); show('已暂存在当前浏览器。'); }
    catch { show('当前浏览器无法保存；你仍可打印或另存为 PDF。'); }
  });
  document.getElementById('clear').addEventListener('click', () => {
    form.reset();
    try { localStorage.removeItem(key); } catch {}
    show('表单已清空。');
  });
  document.getElementById('print').addEventListener('click', () => window.print());
  try {
    const saved = JSON.parse(localStorage.getItem(key) || '{}');
    for (const [name, value] of Object.entries(saved)) {
      const field = form.elements.namedItem(name);
      if (!field) continue;
      if (field instanceof RadioNodeList) {
        for (const radio of field) radio.checked = radio.value === value;
      } else field.value = value;
    }
    if (Object.keys(saved).length) show('已载入上次在本机暂存的内容。');
  } catch {}
</script>
</body>
</html>
